[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
xs-core = { path = "crates/xs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image and capture code is far too slow unoptimized; keep debug builds usable for
# timing the crosshair (APP-048) without slowing our own crates' compile cycle.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.xs-capture]
opt-level = 2
