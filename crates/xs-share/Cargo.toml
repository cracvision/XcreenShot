[package]
name = "xs-share"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sharing: the local network with other XcreenShot users (SHR-042 to SHR-044)"

[dependencies]
xs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
base64 = "0.22"
# The local network (SHR-042 to SHR-044), approved by Carlos on 2026-11-15:
# discovery with DNS-SD/mDNS, and TLS 1.3 with pinned raw public keys.
mdns-sd = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# Email through the system's mail interface and opening a draft (SHR-020).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Mapi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
xs-library = { path = "../xs-library" }

[lints]
workspace = true
