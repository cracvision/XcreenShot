[package]
name = "xs-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cloud AI: the API key in the system keychain and requests to the Claude API (SMT-039 to SMT-042)"

[dependencies]
xs-core.workspace = true
xs-editor = { path = "../xs-editor" }
xs-image = { path = "../xs-image" }
xs-library = { path = "../xs-library" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# No official Rust SDK: plain HTTPS with the system's TLS and proxy (SMT-042).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
