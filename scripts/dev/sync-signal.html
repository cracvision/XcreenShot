<!doctype html>
<!--
  VID-030: the light and sound signal for the sync test. Every 10 s the page turns
  white for 100 ms and beeps (1 kHz, 100 ms) at the same moment, as the browser
  reports the sound reaching the speakers. Record it with the system's sound and
  measure the recording with the `sync_check` test (tests/manual/VID-030.md).
  Use wired speakers or headphones: Bluetooth delays the sound after the recorder
  hears it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sync signal</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #777;
        font: 16px system-ui, sans-serif;
      }
      body.flash {
        background: #fff;
      }
      #panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
      }
      button {
        font: inherit;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <button id="start">Start</button>
      <span id="state">Every 10 s: a white flash and a beep.</span>
    </div>
    <script>
      const PERIOD = 10;
      const LENGTH = 0.1;
      let ctx;
      let next;

      function beepAt(t) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 1000;
        gain.gain.value = 0.5;
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + LENGTH);
      }

      // When a sound scheduled at context time `t` is heard, in performance time.
      function heardAt(t) {
        const ts = ctx.getOutputTimestamp();
        return ts.performanceTime + (t - ts.contextTime) * 1000;
      }

      function frame(now) {
        const at = heardAt(next);
        if (now >= at - 8) {
          document.body.classList.add("flash");
          setTimeout(() => document.body.classList.remove("flash"), LENGTH * 1000);
          next += PERIOD;
          beepAt(next);
        }
        requestAnimationFrame(frame);
      }

      document.getElementById("start").addEventListener("click", () => {
        ctx = new AudioContext();
        next = ctx.currentTime + 3;
        beepAt(next);
        // The panel goes away so the page is black between flashes.
        document.getElementById("panel").remove();
        requestAnimationFrame(frame);
      });
    </script>
  </body>
</html>
